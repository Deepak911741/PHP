<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link rel="icon" type="image/x-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqxyFWF1PL4_YrBvurAYo1TZsqVvGnobk1Pw&s">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Registration Form</h2>
        <form id="registrationForm" action="ragister.php" method="POST" enctype="multipart/form-data">
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2" for="firstname">First-Name</label>
                <input class="appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="firstname" name="firstname" type="text" placeholder="Enter your username" required />
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2" for="lastname">Last-Name</label>
                <input class="appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="lastname" name="lastname" type="text" placeholder="Enter your username" required />
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2" for="email">Email</label>
                <input class="appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="email" name="email" type="email" placeholder="Enter your email" required />
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2" for="gender">Gender</label>
                <input class="" id="gender" name="gender" type="radio" value="male" required /> <label for="gender">Male</label>
                <input class="" id="gender" name="gender" type="radio" value="female" required /> <label for="gender">Female</label>
            </div>
            
          
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2" for="image">Hobby</label>
                <input class="appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="hobby" name="hobby" type="text" placeholder="Enter your hobby" />
                <p id="imageError" class="text-red-500 mt-2"></p>
            </div>
            <div class="flex items-center justify-between">
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">Register</button>
            </div>
        </form>
    </div>
    
</body>
</html>
