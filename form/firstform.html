<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Handling with Animation</title>
    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        animation: fadeIn 1s ease-in-out;
      }

      form {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 300px;
        animation: fadeIn 1.2s ease-in-out;
      }

      label {
        font-weight: bold;
        margin-bottom: 5px;
        display: block;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"],
      select {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        animation: fadeIn 1.4s ease-in-out;
      }

      input[type="checkbox"],
      input[type="radio"] {
        margin-right: 5px;
      }

      button[type="submit"] {
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        border: none;
        border-radius: 4px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        z-index: 1;
        transition: background-color 0.3s ease;
        animation: fadeIn 1.6s ease-in-out;
      }

      button[type="submit"]::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 300%;
        height: 300%;
        background-color: rgba(255, 255, 255, 0.5);
        transform: translate(-50%, -50%) scale(0);
        transition: transform 0.5s ease;
        border-radius: 50%;
        z-index: -1;
      }

      button[type="submit"]:hover::before {
        transform: translate(-50%, -50%) scale(1);
      }

      button[type="submit"]:hover {
        background-color: #218838;
      }

      input::placeholder {
        color: #888;
      }

      select {
        padding: 10px;
      }

      input[type="checkbox"],
      input[type="radio"],
      span {
        margin-right: 10px;
        animation: fadeIn 1.6s ease-in-out;
      }
    </style>
  </head>
  <body>
    <form action="firstform.php" method="post">
      <label for="">Name:</label>
      <input type="text" name="name" placeholder="enter your name" />

      <label for="">Email:</label>
      <input type="email" name="email" placeholder="enter your email" />

      <label for="">Password:</label>
      <input
        type="password"
        name="password"
        placeholder="enter your password"
      />

      <label>Skills:</label>
      <input type="checkbox" name="skills" value="php" /><span>PHP</span>
      <input type="checkbox" name="skills" value="java" /><span>JAVA</span>
      <input type="checkbox" name="skills" value="cpp" /><span>CPP</span>
      <input type="checkbox" name="skills" value="javascript" /><span>JavaScript</span>

      <label>Gender:</label>
      <input type="radio" name="gender" value="male" /><span for="gender">Male</span>
      <input type="radio" name="gender" value="female" /><span for="gender">Female</span>

      <select name="colorName">
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="aqua">Aqua</option>
        <option value="black">Black</option>
      </select>
      <button type="submit">Send</button>
    </form>
  </body>
</html>
